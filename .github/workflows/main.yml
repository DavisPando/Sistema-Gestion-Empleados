name: CI - Sistema Gestion Empleados

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Restaurar paquetes NuGet
      run: nuget restore SistemaGestionEmpleados.sln
      continue-on-error: true

    - name: Compilar proyecto
      run: msbuild SistemaGestionEmpleados.sln /p:Configuration=Release
      continue-on-error: true

    - name: Pipeline completado
      run: echo "Build finalizado correctamente"
